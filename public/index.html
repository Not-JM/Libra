<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libra</title>
    <link rel="stylesheet" href="sign-in-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="brand-logo">
        <span class="brand-logo-icon">
            <img src="images/libra.png" alt="Libra logo">
        </span>
        <span class="brand-logo-text">Libra</span>
    </div>
    <form id="signup-form" class="sign-in-box">
        <div class="title">SIGN UP</div>
        <input id="name" type="text" placeholder="Name (optional)">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" required>
        <div class="select-row">
            <select id="grade" class="grade-select" required>
                <option value="" disabled selected hidden>Grade Level</option>
                <option value="Freshman">Freshman - 9th</option>
                <option value="Sophomore">Sophomore - 10th</option>
                <option value="Junior">Junior - 11th</option>
                <option value="Senior">Senior - 12th</option>
            </select>
            <select id="gpa" class="gpa-select" required>
                <option value="" disabled selected hidden>GPA</option>
                <option value="4.0+">4.0+</option>
                <option value="3.5-3.9">3.5-3.9</option>
                <option value="3.0-3.4">3.0-3.4</option>
                <option value="2.5-2.9">2.5-2.9</option>
                <option value="<2.5">&lt;2.5</option>
            </select>
        </div>
        <button type="submit">Create Account</button>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    \
<script>
    async function initSignup() {
        // 1. Fetch credentials loaded from .env by the server
        const configRes = await fetch('/api/config')
        const config = await configRes.json()

        const { createClient } = supabase
        const _supabase = createClient(config.supabaseUrl, config.supabaseKey)

        const signupForm = document.getElementById('signup-form')

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault()

            // Grab input values
            const name = document.getElementById('name').value.trim() || 'Student'
            const email = document.getElementById('email').value.trim()
            const password = document.getElementById('password').value
            const grade = document.getElementById('grade').value
            const gpa = document.getElementById('gpa').value

            // Validation
            if (password.length < 6) {
                alert('Password must be at least 6 characters long.')
                return
            }

            // Create Auth Account
            const { data, error } = await _supabase.auth.signUp({
                email: email,
                password: password,
            })

            if (error) {
                console.error('Supabase Error Details:', error)
                alert('Error signing up: ' + (error.message || JSON.stringify(error)))
                return
            }

            // Save extra fields to the profiles table
            if (data?.user) {
                const { error: profileError } = await _supabase
                    .from('profiles')
                    .upsert([
                        {
                            id: data.user.id,
                            display_name: name,
                            grade_level: grade,
                            gpa: gpa
                        }
                    ])

                if (profileError) {
                    console.error('Error creating/updating profile:', profileError)
                    alert('Profile save error: ' + profileError.message)
                    return
                }

                // Redirect to survey with user ID
                window.location.href = `survey.html?uid=${data.user.id}`
            }
        })
    }

    initSignup()
</script>
</body>

</html>
