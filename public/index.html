<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauro</title>
    <link rel="stylesheet" href="sign-in-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    
    <!-- Cloudflare Turnstile API Script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="brand-logo">
        <span class="brand-logo-icon">
            <img src="images/Taurus.png" alt="Taurus logo">
        </span>
        <span class="brand-logo-text">Tauro</span>
    </div>
    
    <form id="signup-form" class="sign-in-box">
        <div class="title">SIGN UP</div>
        
        <!-- Honeypot Field: Invisible to human users, traps automated bots -->
        <input type="text" name="website" id="honeypot" style="display:none;" tabindex="-1" autocomplete="off">

        <input id="name" type="text" placeholder="Name">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" required>
        
        <div class="select-row">
            <select id="grade" class="grade-select" required>
                <option value="" disabled selected hidden>Grade Level</option>
                <option value="Freshman">Freshman - 9th</option>
                <option value="Sophomore">Sophomore - 10th</option>
                <option value="Junior">Junior - 11th</option>
                <option value="Senior">Senior - 12th</option>
            </select>
            <select id="gpa" class="gpa-select" required>
                <option value="" disabled selected hidden>GPA</option>
                <option value="4.0+">4.0+</option>
                <option value="3.5-3.9">3.5-3.9</option>
                <option value="3.0-3.4">3.0-3.4</option>
                <option value="2.5-2.9">2.5-2.9</option>
                <option value="<2.5">&lt;2.5</option>
            </select>
        </div>

        <!-- Turnstile Widget: Replace YOUR_SITE_KEY with the Site Key from Cloudflare -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAENiA7jAha8_OFNB"></div>

        <button type="submit">Create Account</button>
    </form>

    <script>
        async function initSignup() {
            // Fetch credentials loaded from .env by the server
            const configRes = await fetch('/api/config')
            const config = await configRes.json()

            const { createClient } = supabase
            const _supabase = createClient(config.supabaseUrl, config.supabaseKey)

            const signupForm = document.getElementById('signup-form')

            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault()

                // Verify Cloudflare Turnstile CAPTCHA response
                const turnstileResponse = document.querySelector('[name="cf-turnstile-response"]')?.value
                if (!turnstileResponse) {
                    alert('Please complete the CAPTCHA check to verify you are human.')
                    return
                }

                // Check Honeypot Field (Silently redirect if filled by a bot)
                const honeypot = document.getElementById('honeypot').value
                if (honeypot) {
                    window.location.href = 'survey.html'
                    return
                }

                // Grab input values
                const name = document.getElementById('name').value.trim() || 'Student'
                const email = document.getElementById('email').value.trim()
                const password = document.getElementById('password').value
                const grade = document.getElementById('grade').value
                const gpa = document.getElementById('gpa').value

                // Validate password length
                if (password.length < 6) {
                    alert('Password must be at least 6 characters long.')
                    return
                }

                // Block common fake / disposable email provider domains
                const domain = email.split('@')[1]?.toLowerCase()
                const fakeDomains = ['mailinator.com', 'yopmail.com', '10minutemail.com', 'tempmail.com', 'guerrillamail.com']
                if (fakeDomains.includes(domain)) {
                    alert('Please use a valid personal or school email address.')
                    return
                }

                // Create Auth Account
                const { data, error } = await _supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            display_name: name,
                            grade_level: grade,
                            gpa: gpa
                        }
                    }
                })

                if (error) {
                    console.error('Supabase Error Details:', error)
                    alert('Error signing up: ' + (error.message || JSON.stringify(error)))
                    return
                }

                // Save extra fields to the profiles table
                if (data?.user) {
                    const { error: profileError } = await _supabase
                        .from('profiles')
                        .upsert([
                            {
                                id: data.user.id,
                                display_name: name,
                                grade_level: grade,
                                gpa: gpa
                            }
                        ])

                    if (profileError) {
                        console.error('Error updating profile:', profileError)
                    }

                    // Direct redirect to survey
                    window.location.href = `survey.html?uid=${data.user.id}`
                }
            })
        }

        initSignup()
    </script>
</body>

</html>
